[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustworthy-tls-pathology-audit"
version = "0.1.0"
description = "Reliability and uncertainty audit utilities for a multi-model TLS pathology workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kaicheng Li" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "Pillow>=10.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
wsi = ["openslide-python>=1.3", "h5py>=3.10"]
models = ["torch>=2.2", "ultralytics>=8.3", "opencv-python-headless>=4.9"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
