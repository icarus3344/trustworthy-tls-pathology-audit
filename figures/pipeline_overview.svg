<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 310" width="1080" height="310" role="img" aria-labelledby="title description">
  <title id="title">TLS pathology audit workflow</title>
  <desc id="description">HookNet-TLS finds candidate polygons on a whole-slide H&amp;E image. A two-stage YOLO cascade assigns maturity labels for robustness tests. PathPrism maps tissue from the same slide. Candidate polygons and tissue tiles are aligned in micrometres for a slide-matched spatial comparison.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .heading { font-size: 25px; font-weight: 700; fill: #14263d; }
      .label { font-size: 21px; font-weight: 700; fill: #14263d; }
      .detail { font-size: 16px; fill: #364a5f; }
      .source { fill: #fff; stroke: #94a3b8; }
      .candidate { fill: #eaf2fe; stroke: #91b5e4; }
      .tissue { fill: #e6f5f1; stroke: #7bbba9; }
      .result { fill: #fff6df; stroke: #dfb66c; }
      .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .blue { stroke: #37669f; marker-end: url(#arrow-blue); }
      .green { stroke: #277767; marker-end: url(#arrow-green); }
    </style>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7Z" fill="#37669f"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7Z" fill="#277767"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1078" height="308" rx="18" fill="#f6f8fc" stroke="#d4dde8"/>
  <text x="28" y="42" class="heading">Two audit branches from the same H&amp;E slide</text>

  <path class="arrow blue" d="M182 171H199V112H216"/>
  <path class="arrow green" d="M182 171H199V238H216"/>
  <path class="arrow blue" d="M433 112H473"/>
  <path class="arrow blue" d="M714 112H754"/>
  <path class="arrow green" d="M433 238H473"/>
  <path class="arrow green" d="M714 238H754"/>
  <path class="arrow blue" d="M323 151V174H593V199"/>

  <g>
    <rect x="28" y="132" width="154" height="78" rx="12" class="source"/>
    <text x="105" y="166" text-anchor="middle" class="label">Whole slide</text>
    <text x="105" y="190" text-anchor="middle" class="detail">H&amp;E image</text>
  </g>

  <g>
    <rect x="216" y="73" width="217" height="78" rx="12" class="candidate"/>
    <text x="232" y="106" class="label">HookNet-TLS</text>
    <text x="232" y="130" class="detail">Candidate polygons</text>
  </g>
  <g>
    <rect x="473" y="73" width="241" height="78" rx="12" class="candidate"/>
    <text x="489" y="106" class="label">Two-stage YOLO</text>
    <text x="489" y="130" class="detail">TLS maturity predictions</text>
  </g>
  <g>
    <rect x="754" y="73" width="298" height="78" rx="12" class="result"/>
    <text x="770" y="106" class="label">Robustness audit</text>
    <text x="770" y="130" class="detail">Crop, stain and attribution tests</text>
  </g>

  <g>
    <rect x="216" y="199" width="217" height="78" rx="12" class="tissue"/>
    <text x="232" y="232" class="label">PathPrism</text>
    <text x="232" y="256" class="detail">STAMP / UNI + PrismNet</text>
  </g>
  <g>
    <rect x="473" y="199" width="241" height="78" rx="12" class="tissue"/>
    <text x="489" y="232" class="label">Align in µm</text>
    <text x="489" y="256" class="detail">TLS polygons + tissue tiles</text>
  </g>
  <g>
    <rect x="754" y="199" width="298" height="78" rx="12" class="result"/>
    <text x="770" y="232" class="label">Spatial concordance</text>
    <text x="770" y="256" class="detail">Radial features + same-slide controls</text>
  </g>
</svg>
