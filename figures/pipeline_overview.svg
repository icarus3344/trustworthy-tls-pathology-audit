<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #17324d; }
      .branch { font: 700 18px Arial, sans-serif; fill: #5b6770; letter-spacing: 1px; }
      .label { font: 700 22px Arial, sans-serif; fill: #17324d; }
      .body { font: 18px Arial, sans-serif; fill: #34495e; }
      .small { font: 16px Arial, sans-serif; fill: #566573; }
      .box-a { fill: #f4f8fc; stroke: #376b8c; stroke-width: 3; rx: 18; }
      .box-b { fill: #f1faf8; stroke: #2a7f72; stroke-width: 3; rx: 18; }
      .source { fill: #f7fafc; stroke: #17324d; stroke-width: 3; rx: 18; }
      .audit { fill: #fff7e6; stroke: #d48806; stroke-width: 3; rx: 18; }
      .arrow-a { stroke: #376b8c; stroke-width: 4; fill: none; marker-end: url(#head-a); }
      .arrow-b { stroke: #2a7f72; stroke-width: 4; fill: none; marker-end: url(#head-b); }
      .warning { font: 700 17px Arial, sans-serif; fill: #9a5b00; }
    </style>
    <marker id="head-a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#376b8c"/>
    </marker>
    <marker id="head-b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2a7f72"/>
    </marker>
  </defs>

  <text x="700" y="42" text-anchor="middle" class="title">One H&amp;E source, two model branches, one reliability audit</text>

  <rect x="550" y="72" width="300" height="100" class="source"/>
  <text x="700" y="112" text-anchor="middle" class="label">Public H&amp;E WSI</text>
  <text x="700" y="142" text-anchor="middle" class="body">physical scale · MPP</text>
  <text x="700" y="165" text-anchor="middle" class="small">same image source for both branches</text>

  <text x="130" y="215" class="branch">A · TLS CANDIDATE AND WORKING MATURITY</text>
  <rect x="90" y="235" width="270" height="125" class="box-a"/>
  <text x="225" y="278" text-anchor="middle" class="label">HookNet-TLS</text>
  <text x="225" y="310" text-anchor="middle" class="body">candidate polygon</text>
  <text x="225" y="337" text-anchor="middle" class="small">model output, not pathology GT</text>

  <rect x="420" y="235" width="300" height="125" class="box-a"/>
  <text x="570" y="278" text-anchor="middle" class="label">YOLO cascade</text>
  <text x="570" y="310" text-anchor="middle" class="body">working E / P / S label</text>
  <text x="570" y="337" text-anchor="middle" class="small">two-stage maturity inference</text>

  <text x="820" y="215" class="branch">B · SURROUNDING TISSUE SEMANTICS</text>
  <rect x="790" y="235" width="240" height="125" class="box-b"/>
  <text x="910" y="278" text-anchor="middle" class="label">STAMP / UNI</text>
  <text x="910" y="310" text-anchor="middle" class="body">tiles + frozen features</text>
  <text x="910" y="337" text-anchor="middle" class="small">coordinate-bearing embeddings</text>

  <rect x="1090" y="235" width="260" height="125" class="box-b"/>
  <text x="1220" y="278" text-anchor="middle" class="label">PrismNet</text>
  <text x="1220" y="310" text-anchor="middle" class="body">8 tissue classes + BACK</text>
  <text x="1220" y="337" text-anchor="middle" class="small">probabilities at tile scale</text>

  <path d="M620,172 L620,188 L50,188 L50,298 L90,298" class="arrow-a"/>
  <path d="M360,298 L420,298" class="arrow-a"/>
  <path d="M780,172 L780,188 L760,188 L760,298 L790,298" class="arrow-b"/>
  <path d="M1030,298 L1090,298" class="arrow-b"/>

  <rect x="235" y="430" width="930" height="125" class="audit"/>
  <text x="700" y="470" text-anchor="middle" class="label">Physical-coordinate alignment + reliability audit</text>
  <text x="700" y="504" text-anchor="middle" class="body">context · preprocessing · attribution · radial features · matched controls</text>
  <text x="700" y="533" text-anchor="middle" class="small">slide-aware summaries · uncertainty flags · manual-review queue</text>
  <path d="M570,360 C570,400 520,405 520,430" class="arrow-a"/>
  <path d="M1220,360 C1220,410 880,395 880,430" class="arrow-b"/>

  <text x="700" y="592" text-anchor="middle" class="warning">Cross-model concordance on the same H&amp;E is not independent biological validation.</text>
</svg>
